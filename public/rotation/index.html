<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotation & Overlap Trainer — Officials Clinic</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B1B2F;--gold:#F26522}
html,body{height:100%;background:#0f172a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#page{position:fixed;inset:0;display:flex;flex-direction:column}
header{background:var(--navy);border-bottom:3px solid var(--gold);padding:0 20px;height:52px;display:flex;align-items:center;gap:14px;flex-shrink:0}
header a{color:rgba(255,255,255,0.6);text-decoration:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;}
header a:hover{color:#fff}
header h1{font-size:14px;font-weight:700;color:#fff;letter-spacing:0.3px}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;}
#vbt-container{position:relative;background:#0f172a;}
</style>
</head>
<body>
<div id="page">
  <header>
    <a href="/">&larr; Dashboard</a>
    <h1>Volleyball Rotation &amp; Overlap Trainer</h1>
  </header>
  <div id="stage"><div id="vbt-container"></div></div>
</div>
<script src="/assets/volleyball-trainer.js?v=7"></script>
<script>
  const stage = document.getElementById('stage');
  const container = document.getElementById('vbt-container');
  let resizeTimer = null;
  function mountTrainer() {
    const ratio = 16 / 9;
    let w = stage.clientWidth, h = w / ratio;
    if (h > stage.clientHeight) { h = stage.clientHeight; w = h * ratio; }
    container.style.width = w + 'px';
    container.style.height = h + 'px';
    const sc = w / 960;
    VolleyballTrainer.mount(container, {}, sc, { onChange: null });
  }
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(mountTrainer, 250);
  });
  mountTrainer();
</script>
</body>
</html>
