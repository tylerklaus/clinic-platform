<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vote — Clinic</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B1B2F;--gold:#F26522;--bg:#0f0f1a;--surface:#1e1e32;--border:rgba(255,255,255,0.1);--text:#f0f0f0;--text2:rgba(255,255,255,0.55)}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
#page{min-height:100vh;display:flex;flex-direction:column;padding:20px;padding-bottom:40px;}
header{text-align:center;padding:12px 0 24px;}
header .eyebrow{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:2px;text-transform:uppercase;}
header h1{font-size:16px;font-weight:700;color:#fff;margin-top:4px;}
#stage{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:480px;margin:0 auto;width:100%;}

#lobby{text-align:center;color:var(--text2);display:flex;flex-direction:column;align-items:center;gap:16px;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

#q-video{display:none;width:100%;max-height:220px;border-radius:12px;background:#000;margin-bottom:18px;}

#voting{display:none;flex-direction:column;gap:22px;}
#progress{text-align:center;font-size:11px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;}
#q-text{font-size:22px;font-weight:800;color:#fff;text-align:center;line-height:1.3;}
#options{display:flex;flex-direction:column;gap:12px;}
.opt-btn{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:16px 18px;color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;transition:border-color 0.15s,background 0.15s;}
.opt-btn:active{background:rgba(242,101,34,0.12);}
.opt-btn.selected{border-color:var(--gold);background:rgba(242,101,34,0.14);}
#vote-status{text-align:center;font-size:13px;color:var(--text2);}
#vote-status.voted{color:#6fd19a;}

#results{display:none;flex-direction:column;gap:14px;}
.res-bar{position:relative;background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:14px 16px;overflow:hidden;}
.res-bar.correct{border-color:#4caf82;}
.res-bar.yours{border-color:var(--gold);}
.res-bar-fill{position:absolute;top:0;left:0;bottom:0;background:rgba(242,101,34,0.18);transition:width 0.5s ease;}
.res-bar.correct .res-bar-fill{background:rgba(76,175,130,0.22);}
.res-bar-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.res-bar-text{font-size:15px;font-weight:600;color:#fff;}
.res-bar-pct{font-size:13px;font-weight:700;color:var(--text2);flex-shrink:0;}
.res-tag{font-size:9px;font-weight:800;padding:1px 7px;border-radius:8px;text-transform:uppercase;margin-left:6px;}
.res-tag.correct{background:rgba(76,175,130,0.2);color:#6fd19a;}
.res-tag.yours{background:rgba(242,101,34,0.2);color:var(--gold);}
#results-summary{text-align:center;font-size:12px;color:var(--text2);}
</style>
</head>
<body>
<div id="page">
  <header>
    <div class="eyebrow">Live Quiz</div>
    <h1 id="quiz-title">&nbsp;</h1>
  </header>
  <div id="stage">
    <div id="lobby">
      <div class="spinner"></div>
      <div id="lobby-msg">Connecting...</div>
    </div>
    <video id="q-video" controls playsinline muted></video>
    <div id="voting">
      <div id="progress"></div>
      <div id="q-text"></div>
      <div id="options"></div>
      <div id="vote-status"></div>
    </div>
    <div id="results">
      <div id="results-progress" style="text-align:center;font-size:11px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;"></div>
      <div id="results-q" style="font-size:20px;font-weight:800;color:#fff;text-align:center;line-height:1.3;margin-bottom:4px;"></div>
      <div id="results-bars"></div>
      <div id="results-summary"></div>
    </div>
  </div>
</div>
<script>
const slug = location.pathname.split('/quiz/')[1].split('/')[0];

function getVoterId() {
  const key = 'clinic_quiz_voter_id';
  let id = localStorage.getItem(key);
  if (!id) {
    id = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem(key, id);
  }
  return id;
}
const voterId = getVoterId();

let currentQuestionId = null;
let submitting = false;
let currentVideoUrl; // undefined = not yet set; distinct from null = "this question has no video"

// Only touches the <video> element when the attached video actually changes — otherwise
// every 1.5s poll tick would restart playback out from under anyone watching.
function updateVideo(url) {
  if (url === currentVideoUrl) return;
  currentVideoUrl = url;
  const video = document.getElementById('q-video');
  if (url) {
    video.src = url;
    video.muted = true; // every clip starts muted on voter devices, even if a voter unmuted a previous one
    video.style.display = 'block';
    video.load();
  } else {
    video.pause();
    video.removeAttribute('src');
    video.load();
    video.style.display = 'none';
  }
}

function showPanel(name) {
  ['lobby', 'voting', 'results'].forEach(p => {
    document.getElementById(p).style.display = (p === name) ? 'flex' : 'none';
  });
}

async function castVote(questionId, optionIndex, btnEl) {
  if (submitting) return;
  submitting = true;
  document.querySelectorAll('#options .opt-btn').forEach(b => b.classList.remove('selected'));
  btnEl.classList.add('selected');
  document.getElementById('vote-status').textContent = 'Submitting...';
  document.getElementById('vote-status').className = '';
  try {
    const r = await fetch('/api/quizzes/' + slug + '/vote', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ questionId, voterId, optionIndex })
    });
    const d = await r.json();
    if (r.ok) {
      document.getElementById('vote-status').textContent = "You're in! Waiting for the host to reveal results...";
      document.getElementById('vote-status').className = 'voted';
    } else {
      document.getElementById('vote-status').textContent = d.error || 'Could not submit — try again';
    }
  } catch (e) {
    document.getElementById('vote-status').textContent = 'Network error — try again';
  }
  submitting = false;
}

function renderVoting(state) {
  document.getElementById('progress').textContent = 'Question ' + state.position + ' of ' + state.total;
  document.getElementById('q-text').textContent = state.text;
  const list = document.getElementById('options');
  list.innerHTML = '';
  state.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (state.yourVote === i ? ' selected' : '');
    btn.textContent = opt;
    btn.addEventListener('click', () => castVote(state.questionId, i, btn));
    list.appendChild(btn);
  });
  const status = document.getElementById('vote-status');
  if (state.yourVote !== null && state.yourVote !== undefined) {
    status.textContent = "You're in! Waiting for the host to reveal results... (tap another option to change your vote)";
    status.className = 'voted';
  } else {
    status.textContent = 'Tap an option to vote';
    status.className = '';
  }
}

function renderResults(state) {
  document.getElementById('results-progress').textContent = 'Question ' + state.position + ' of ' + state.total;
  document.getElementById('results-q').textContent = state.text;
  const bars = document.getElementById('results-bars');
  bars.innerHTML = '';
  const total = state.total_votes || 0;
  state.options.forEach((opt, i) => {
    const count = state.counts[i] || 0;
    const pct = total ? Math.round((count / total) * 100) : 0;
    const isCorrect = state.correct_index === i;
    const isYours = state.yourVote === i;
    const bar = document.createElement('div');
    bar.className = 'res-bar' + (isCorrect ? ' correct' : '') + (isYours && !isCorrect ? ' yours' : '');
    bar.innerHTML = `
      <div class="res-bar-fill" style="width:${pct}%;"></div>
      <div class="res-bar-row">
        <div class="res-bar-text">${opt}${isCorrect ? '<span class="res-tag correct">Correct</span>' : ''}${isYours ? '<span class="res-tag yours">Your vote</span>' : ''}</div>
        <div class="res-bar-pct">${pct}%</div>
      </div>`;
    bars.appendChild(bar);
  });
  document.getElementById('results-summary').textContent = total + (total === 1 ? ' vote total' : ' votes total');
}

async function poll() {
  try {
    const r = await fetch('/api/quizzes/' + slug + '/live?voterId=' + encodeURIComponent(voterId));
    if (!r.ok) return;
    const state = await r.json();
    document.getElementById('quiz-title').textContent = state.title || '';

    if (!state.live) {
      showPanel('lobby');
      document.getElementById('lobby-msg').textContent = 'Waiting for the host to start...';
      currentQuestionId = null;
      updateVideo(null);
      return;
    }
    currentQuestionId = state.questionId;
    updateVideo(state.video_url || null);
    if (state.revealed) {
      showPanel('results');
      renderResults(state);
    } else {
      showPanel('voting');
      renderVoting(state);
    }
  } catch (e) {
    // transient network hiccup — next poll retries
  }
}

setInterval(poll, 1500);
poll();
</script>
</body>
</html>
